name: Render social preview card
on:
  push:
    branches:
      - 'feat/**'
    paths:
      - assets/social-card.svg
      - .github/workflows/render-social-card.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install SVG renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
      - name: Render shareable 1200x630 PNG
        run: |
          rsvg-convert --width 1200 --height 630 --format png -o assets/social-card.png assets/social-card.svg
          file assets/social-card.png
          test -s assets/social-card.png
      - name: Commit generated preview to current branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/social-card.png
          if git diff --cached --quiet; then
            echo "Share preview unchanged."
          else
            git commit -m "build: render social preview card [skip ci]"
            git push
          fi
